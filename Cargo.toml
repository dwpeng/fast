[package]
name = "fast"
version = "0.1.0"
edition = "2024"
description = "Fast FASTA/FASTQ toolkit: stats, fa2fq, fq2fa, merge and head"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
memchr = "2.8.0"
noodles-fasta = "0.68.0"
noodles-fastq = "0.24.0"
rapidgzip-core = "0.3.1"
rayon = "1.12.0"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
